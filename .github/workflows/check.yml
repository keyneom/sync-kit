name: check

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: corepack enable
      - run: corepack prepare pnpm@9.15.9 --activate
      - run: npm ci
      - run: npm run check

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run Android unit tests
        working-directory: android
        run: ./gradlew :synckit:testDebugUnitTest --no-daemon

  # Runs both publish workflows' exact setup and everything short of the
  # upload, on every push and PR. The jobs above rely on whatever Java and
  # Android SDK the runner image ships; the publish workflows install their own.
  # That divergence let a removed Android SDK package break every release while
  # this workflow stayed green — found only by tagging 0.4.2. Keep the steps
  # below in lockstep with publish-npm.yml and publish-android.yml.
  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - run: corepack enable
      - run: corepack prepare pnpm@9.15.9 --activate
      - run: npm ci
      - run: npm run check

      # Right after a release package.json equals the published version, and
      # npm refuses a dry run over an existing version. Dry-run a throwaway
      # prerelease instead; the workspace is discarded after the job.
      - name: Use a throwaway version
        run: npm version --no-git-tag-version "$(node -p "require('./package.json').version")-dryrun.${GITHUB_RUN_ID}"

      # Provenance needs the OIDC token only the tag workflow is granted.
      - name: npm publish (dry run)
        run: npm publish --dry-run --provenance=false --tag dryrun

      - name: Android publication (to Maven local)
        working-directory: android
        run: >
          ./gradlew :synckit:publishReleasePublicationToMavenLocal
          --no-daemon
          -PsynckitVersion=$(node -p "require('../package.json').version")
